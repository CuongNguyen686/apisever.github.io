<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tweak Key Server</title>
<style>
:root{--pink:#ec4899;--pink2:#fce7f3;--bg:#fff7fb;--text:#1f2937;--muted:#6b7280;--line:#f5d0e3;--red:#ef4444;--green:#10b981}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#fff1f7,#fff,#fff1f2)}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 35px #f3b6d42e}.login-card{width:min(390px,100%);padding:28px}
.logo{width:52px;height:52px;border-radius:15px;background:var(--pink);color:#fff;display:grid;place-items:center;margin:auto;font-size:24px}
h1{margin:0 0 6px;font-size:24px}h2{font-size:16px;margin:0 0 14px}p{margin:0}.muted{color:var(--muted);font-size:13px}
label{font-size:12px;color:#6b7280;font-weight:600;display:block;margin:13px 0 6px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;outline:none;background:#fff}input:focus,select:focus,textarea:focus{border-color:#f472b6;box-shadow:0 0 0 3px #fce7f3}
.btn{border:1px solid var(--line);background:#fff;color:#be185d;border-radius:9px;padding:9px 13px}.btn.primary{background:var(--pink);color:#fff;border-color:var(--pink)}.btn.danger{color:#dc2626;border-color:#fecaca}.btn.small{padding:6px 9px;font-size:12px}
.app{display:flex;min-height:100vh}.side{width:245px;background:#fff;border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;padding:8px 10px 20px;font-weight:800}.brand-icon{width:34px;height:34px;background:var(--pink);color:#fff;border-radius:10px;display:grid;place-items:center}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:10px;color:#6b7280}.nav button.active,.nav button:hover{background:var(--pink);color:#fff}.logout{margin-top:auto}.main{flex:1;padding:28px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.stat{padding:18px}.stat .n{font-size:28px;font-weight:800;margin-top:7px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.panel{padding:18px;margin-bottom:14px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 18px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{text-align:left;padding:11px 8px;border-bottom:1px solid #fce7f3;white-space:nowrap}.badge{display:inline-block;padding:4px 7px;border-radius:99px;font-size:11px;background:#f3f4f6}.green{background:#ecfdf5;color:#047857}.red{background:#fef2f2;color:#b91c1c}.pink{background:#fdf2f8;color:#be185d}.empty{text-align:center;padding:50px 15px;border:2px dashed var(--line);border-radius:15px;color:#9ca3af}.modal-bg{position:fixed;inset:0;background:#11182755;display:grid;place-items:center;padding:20px}.modal{width:min(560px,100%);max-height:90vh;overflow:auto;padding:20px}.toast{position:fixed;right:20px;bottom:20px;background:#111827;color:#fff;padding:11px 15px;border-radius:10px;font-size:13px}
pre{background:#111827;color:#fbcfe8;padding:15px;border-radius:12px;overflow:auto;font-size:12px}
@media(max-width:850px){.side{width:190px}.stats{grid-template-columns:repeat(2,1fr)}.grid,.formgrid{grid-template-columns:1fr}.main{padding:18px}}
@media(max-width:600px){.app{display:block}.side{width:100%;border-right:0;border-bottom:1px solid var(--line)}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.logout{margin-top:10px}.stats{grid-template-columns:1fr 1fr}.top{align-items:flex-start;gap:10px}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const state={token:localStorage.getItem("ks_token")||"",tab:"dashboard",packages:[],keys:[],banned:[],detail:null};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function toast(t){const x=document.createElement("div");x.className="toast";x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),2300)}
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{"Content-Type":"application/json",...(state.token?{Authorization:"Bearer "+state.token}:{}),...(opt.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||"REQUEST_FAILED");return d}
function login(){root.innerHTML=`<div class="login"><form class="card login-card" id="login"><div class="logo">🔑</div><h1 style="text-align:center;margin-top:14px">Tweak Key Server</h1><p class="muted" style="text-align:center">Quản lý dev tweak & API key</p><label>Tài khoản</label><input id="u" value="admin" autocomplete="username"><label>Mật khẩu</label><input id="p" type="password" autocomplete="current-password"><button class="btn primary" style="width:100%;margin-top:16px">Đăng nhập</button><p class="muted" style="text-align:center;margin-top:12px">Đổi ADMIN_PASSWORD trước khi đưa server lên production.</p></form></div>`;$("#login").onsubmit=async e=>{e.preventDefault();try{const d=await api("/api/auth/login",{method:"POST",body:JSON.stringify({username:$("#u").value,password:$("#p").value})});state.token=d.token;localStorage.setItem("ks_token",state.token);render()}catch(e){toast("Đăng nhập thất bại: "+e.message)}}}
async function load(){const [p,k,b]=await Promise.all([api("/api/packages"),api("/api/keys"),api("/api/banned-devices")]);state.packages=p;state.keys=k;state.banned=b}
function layout(){root.innerHTML=`<div class="app"><aside class="side"><div class="brand"><div class="brand-icon">🔑</div>Tweak Key Server</div><div class="nav">
<button data-t="dashboard">🏠 Trang chủ</button><button data-t="packages">📦 Package</button><button data-t="keys">🔐 Key</button><button data-t="devices">📱 Thiết bị ban</button><button data-t="docs">📄 API Docs</button></div><button class="btn logout" id="logout">↪ Đăng xuất</button></aside><main class="main" id="view"></main></div>`;
document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{state.tab=b.dataset.t;renderView()});$("#logout").onclick=()=>{localStorage.removeItem("ks_token");state.token="";login()}}
async function render(){try{await load();layout();renderView()}catch(e){localStorage.removeItem("ks_token");state.token="";login()}}
function header(title,sub,btn=""){return `<div class="top"><div><h1>${title}</h1><p class="muted">${sub}</p></div>${btn}</div>`}
function renderView(){document.querySelectorAll("[data-t]").forEach(b=>b.classList.toggle("active",b.dataset.t===state.tab));const v=$("#view");if(state.tab==="dashboard")v.innerHTML=dashboard();if(state.tab==="packages")v.innerHTML=packages();if(state.tab==="keys")v.innerHTML=keys();if(state.tab==="devices")v.innerHTML=devices();if(state.tab==="docs")v.innerHTML=docs();bind()}
function dashboard(){const banned=state.keys.filter(k=>k.banned).length;return header("Trang chủ","Tổng quan server và key")+`<div class="stats"><div class="card stat"><div class="muted">Package</div><div class="n">${state.packages.length}</div></div><div class="card stat"><div class="muted">Tổng key</div><div class="n">${state.keys.length}</div></div><div class="card stat"><div class="muted">Key bị ban</div><div class="n">${banned}</div></div><div class="card stat"><div class="muted">Thiết bị bị ban</div><div class="n">${state.banned.length}</div></div></div><div class="grid"><div class="card panel"><h2>Server</h2><p class="muted">API đang chạy thật trên backend Node.js + SQLite.</p><p style="margin-top:12px"><span class="badge green">● ONLINE</span> <a href="/health" target="_blank">/health</a></p></div><div class="card panel"><h2>Luồng xác thực</h2><p class="muted">Tweak → POST /v1/verify → server kiểm tra API key, key, UID, hạn dùng, lượt dùng và trạng thái ban.</p></div></div>`}
function packages(){return header("Quản lý Package","Tạo package cho từng tweak",`<button class="btn primary" id="newpkg">＋ Tạo package</button>`)+`<div class="card panel"><div class="tablewrap"><table class="table"><thead><tr><th>Tên</th><th>Version</th><th>Trạng thái</th><th>API prefix</th><th>Token</th><th></th></tr></thead><tbody>${state.packages.map(p=>`<tr><td><b>${esc(p.name)}</b><br><span class="muted">${esc(p.description)}</span></td><td>${esc(p.version)}</td><td><span class="badge ${p.status==="active"?"green":"pink"}">${p.status}</span></td><td><code>${esc(p.apiKeyPrefix)}</code></td><td><code>${esc(p.token)}</code></td><td><button class="btn small" data-edit="${p.id}">Sửa</button> <button class="btn small danger" data-del-p="${p.id}">Xoá</button></td></tr>`).join("")||`<tr><td colspan="6"><div class="empty">Chưa có package.</div></td></tr>`}</tbody></table></div></div>`}
function keys(){return header("Quản lý Key","Tạo và kiểm soát key người dùng",`<button class="btn primary" id="newkey">＋ Tạo key</button>`)+`<div class="card panel"><div class="tablewrap"><table class="table"><thead><tr><th>Tên</th><th>Key</th><th>Package</th><th>Lượt</th><th>Hạn</th><th>UID</th><th>Trạng thái</th><th></th></tr></thead><tbody>${state.keys.map(k=>{const p=state.packages.find(x=>x.id===k.packageId);const expired=k.expiresAt<=Date.now();return `<tr><td>${esc(k.name)}</td><td><code>${esc(k.keyPrefix)}...</code></td><td>${esc(p?.name||"—")}</td><td>${k.usedCount}/${k.maxUses}</td><td>${expired?"Hết hạn":new Date(k.expiresAt).toLocaleDateString("vi-VN")}</td><td><code>${esc(k.uid||"—")}</code></td><td><span class="badge ${k.banned||expired?"red":"green"}">${k.banned?"Đã ban":expired?"Hết hạn":"Hoạt động"}</span></td><td><button class="btn small" data-detail="${k.id}">Chi tiết</button></td></tr>`}).join("")||`<tr><td colspan="8"><div class="empty">Chưa có key.</div></td></tr>`}</tbody></table></div></div>`}
function devices(){return header("Thiết bị bị ban","UID bị từ chối khi tweak gọi API")+`<div class="card panel"><div style="display:flex;gap:8px"><input id="banuid" placeholder="UID thiết bị"><button class="btn danger" id="ban">Ban UID</button></div><div style="margin-top:15px">${state.banned.map(x=>`<div style="padding:10px;border-bottom:1px solid #fce7f3;display:flex;justify-content:space-between"><code>${esc(x.uid)}</code><button class="btn small" data-unban="${esc(x.uid)}">Bỏ ban</button></div>`).join("")||`<div class="empty">Chưa có UID bị ban.</div>`}</div></div>`}
function docs(){return header("API Docs","Endpoint để tích hợp vào tweak")+`<div class="card panel"><h2>POST /v1/verify</h2><p class="muted">Header dùng API key của package.</p><pre>Authorization: Bearer &lt;PACKAGE_API_KEY&gt;
Content-Type: application/json

{
  "key": "&lt;USER_KEY&gt;",
  "uid": "&lt;DEVICE_UID&gt;"
}</pre><p class="muted">200 = hợp lệ · 400 = thiếu dữ liệu · 401 = API key sai · 403 = key/UID bị từ chối · 423 = package bảo trì</p></div>`}
function modal(html){const x=document.createElement("div");x.className="modal-bg";x.innerHTML=`<div class="card modal">${html}</div>`;document.body.appendChild(x);return x}
function bind(){
$("#newpkg")?.addEventListener("click",()=>packageModal());
$("#newkey")?.addEventListener("click",()=>keyModal());
document.querySelectorAll("[data-del-p]").forEach(b=>b.onclick=async()=>{if(!confirm("Xoá package và toàn bộ key?"))return;try{await api("/api/packages/"+b.dataset.delP,{method:"DELETE"});await render()}catch(e){toast(e.message)}});
document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>packageModal(state.packages.find(p=>p.id===b.dataset.edit)));
document.querySelectorAll("[data-detail]").forEach(b=>b.onclick=()=>keyModal(state.keys.find(k=>k.id===b.dataset.detail)));
$("#ban")?.addEventListener("click",async()=>{const uid=$("#banuid").value.trim();if(!uid)return;try{await api("/api/banned-devices",{method:"POST",body:JSON.stringify({uid})});await render()}catch(e){toast(e.message)}});
document.querySelectorAll("[data-unban]").forEach(b=>b.onclick=async()=>{await api("/api/banned-devices/"+encodeURIComponent(b.dataset.unban),{method:"DELETE"});await render()});
}
function packageModal(p){const edit=!!p;const x=modal(`<h2>${edit?"Sửa package":"Tạo package"}</h2><div class="formgrid">
<div><label>Tên package</label><input id="pn" value="${esc(p?.name||"")}"></div><div><label>Version</label><input id="pv" value="${esc(p?.version||"1.0.0")}"></div>
<div><label>Mô tả</label><input id="pd" value="${esc(p?.description||"")}"></div><div><label>Tên key</label><input id="pk" value="${esc(p?.keyName||"")}"></div>
<div><label>Link liên hệ</label><input id="pc" value="${esc(p?.contactLink||"")}"></div><div><label>Link cập nhật</label><input id="pu" value="${esc(p?.updateLink||"")}"></div>
<div><label>Thông báo</label><textarea id="pm">${esc(p?.notifyMessage||"")}</textarea></div><div><label>Trạng thái</label><select id="ps"><option value="active" ${p?.status==="active"?"selected":""}>Hoạt động</option><option value="maintenance" ${p?.status==="maintenance"?"selected":""}>Bảo trì</option></select></div>
</div><label><input style="width:auto" type="checkbox" id="pf" ${p?.allowFreeLogin?"checked":""}> Free login</label><label><input style="width:auto" type="checkbox" id="pi" ${p?.getRealUidIOS?"checked":""}> Bắt buộc UID iOS</label><div class="actions"><button class="btn" id="cancel">Huỷ</button><button class="btn primary" id="save">Lưu</button></div>`);x.querySelector("#cancel").onclick=()=>x.remove();x.querySelector("#save").onclick=async()=>{const b={name:$("#pn").value,version:$("#pv").value,description:$("#pd").value,keyName:$("#pk").value,contactLink:$("#pc").value,updateLink:$("#pu").value,notifyMessage:$("#pm").value,status:$("#ps").value,allowFreeLogin:$("#pf").checked,getRealUidIOS:$("#pi").checked};try{const d=await api(edit?"/api/packages/"+p.id:"/api/packages",{method:edit?"PUT":"POST",body:JSON.stringify(b)});x.remove();await render();if(d.apiKey){alert("API KEY mới — hãy lưu lại, server chỉ trả secret này lúc tạo:\\n\\n"+d.apiKey)}}catch(e){toast(e.message)}}}
function keyModal(k){if(!k){const x=modal(`<h2>Tạo key</h2><label>Package</label><select id="kp">${state.packages.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select><label>Số lượt</label><input id="ku" type="number" min="1" value="1"><label>Thời hạn</label><select id="kd"><option value="1d">1 ngày</option><option value="3d">3 ngày</option><option value="7d" selected>7 ngày</option><option value="1th">1 tháng</option><option value="3th">3 tháng</option><option value="1nam">1 năm</option></select><div class="actions"><button class="btn" id="cancel">Huỷ</button><button class="btn primary" id="save">Tạo</button></div>`);x.querySelector("#cancel").onclick=()=>x.remove();x.querySelector("#save").onclick=async()=>{try{const d=await api("/api/keys",{method:"POST",body:JSON.stringify({packageId:$("#kp").value,maxUses:Number($("#ku").value),duration:$("#kd").value})});x.remove();await render();alert("KEY mới — hãy lưu lại vì server chỉ trả key thật lúc tạo:\\n\\n"+d.key.value)}catch(e){toast(e.message)}};return}
const x=modal(`<h2>${esc(k.name)}</h2><p class="muted">${esc(k.keyPrefix)}... · UID: ${esc(k.uid||"chưa có")}</p><label>Ghi chú</label><textarea id="note">${esc(k.note||"")}</textarea><div class="actions"><button class="btn" id="reset">Reset</button><button class="btn danger" id="ban">${k.banned?"Bỏ ban":"Ban key"}</button><button class="btn" id="close">Đóng</button><button class="btn primary" id="save">Lưu</button></div><hr style="border:0;border-top:1px solid #fce7f3;margin:18px 0"><h2>Gửi tin nhắn</h2><input id="msg" placeholder="Thông báo cho người dùng"><button class="btn primary" style="margin-top:8px" id="send">Gửi</button>`);x.querySelector("#close").onclick=()=>x.remove();x.querySelector("#save").onclick=async()=>{await api("/api/keys/"+k.id,{method:"PUT",body:JSON.stringify({note:$("#note").value,banned:k.banned})});x.remove();await render()};x.querySelector("#ban").onclick=async()=>{await api("/api/keys/"+k.id,{method:"PUT",body:JSON.stringify({note:$("#note").value,banned:!k.banned})});x.remove();await render()};x.querySelector("#reset").onclick=async()=>{await api("/api/keys/"+k.id+"/reset",{method:"POST"});x.remove();await render()};x.querySelector("#send").onclick=async()=>{const t=$("#msg").value.trim();if(!t)return;await api("/api/keys/"+k.id+"/messages",{method:"POST",body:JSON.stringify({text:t})});toast("Đã gửi");$("#msg").value=""}}
if(state.token)render();else login();
</script>
</body>
</html>
